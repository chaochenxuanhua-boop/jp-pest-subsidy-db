name: Weekly Municipal Subsidy Monitor & Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - master
  schedule:
    # Runs every Wednesday at 05:30 JST (Tuesday 20:30 UTC)
    - cron: "30 20 * * 2"
  workflow_dispatch:
    inputs:
      live_check:
        description: "Rebuild seed dataset timestamps and run full anti-hallucination validation"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile & run Municipality Harvester scheduled verification loop
        env:
          LIVE_CHECK: ${{ github.event.inputs.live_check || 'false' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python -m py_compile pipeline/municipality_harvester.py
          if [ "$LIVE_CHECK" = "true" ] || [ "$EVENT_NAME" = "schedule" ]; then
            python pipeline/municipality_harvester.py --build-seed --output site/data/municipalities.json
          fi
          python pipeline/municipality_harvester.py --build-pages --output site/data/municipalities.json
          python pipeline/municipality_harvester.py --validate --output site/data/municipalities.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static portal artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate-and-build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
